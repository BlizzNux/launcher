version: 2
updates:
  # Only here for the ignore rule: version-update PRs stay off (limit 0),
  # security updates keep running and obey the ignore list too.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # glib 0.18 is the last GTK 3 binding and Tauri on Linux is built on GTK 3,
      # so every attempt fails. Lift this once Tauri moves to GTK 4.
      - dependency-name: glib
