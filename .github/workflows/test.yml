name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The same base the release bundles are built on (scripts/build-env/Dockerfile).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK and GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Shell scripts parse
        run: |
          for f in bin/blizznux-run scripts/release.sh scripts/container-build.sh install.sh flatpak/build.sh; do
            bash -n "$f"
          done

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib
