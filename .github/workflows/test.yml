name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  test:
    # The same base the release bundles are built on (scripts/build-env/Dockerfile).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK and GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Shell scripts parse
        run: |
          for f in bin/blizznux-run scripts/release.sh scripts/container-build.sh scripts/pin-watch.sh install.sh flatpak/build.sh; do
            bash -n "$f"
          done

      # Without hybrid NVIDIA graphics gpu_env must return success, or set -e ends the
      # wrapper silently before Proton starts (Fedora report, issue #27).
      - name: Wrapper GPU setup on machines without hybrid NVIDIA
        run: |
          bash -c 'set -euo pipefail
            eval "$(sed -n "/^hybrid_nvidia()/,/^}/p;/^gpu_env()/,/^}/p" bin/blizznux-run)"
            hybrid_nvidia() { return 1; }
            CACHE_DIR=$(mktemp -d)
            for OFFLOAD in auto off on; do gpu_env; done
            echo ok'

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # Clippy, Rust's linter. Only the bug-class groups fail the build:
      # correctness (code that is outright wrong) and suspicious (code that is
      # very likely wrong). Style and complexity lints are left alone, so this
      # never forces a reformat or a refactor of working code.
      - name: Clippy (bug-class lints)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

      # Known vulnerabilities in any crate in Cargo.lock (RustSec database).
      # Fails on a vulnerability; "unmaintained" and "unsound" notices are only
      # printed. Two exist today, both deep in Tauri's Linux GUI stack (glib
      # 0.18, proc-macro-error) and fixed only by a Tauri upgrade. Pinned and
      # checksum-verified.
      - name: Dependency audit (RustSec)
        working-directory: src-tauri
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ca.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/ca.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ca.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" audit
